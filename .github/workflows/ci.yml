name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # gitleaks — full-history secret scan on EVERY pull request, via the shared
  # brick in hseshadr/ci (where the mechanics and their rationale live). It runs
  # at the PR because a secret is the one defect you cannot fix by reverting:
  # once a credential lands in this public history it is burned, and a revert
  # only hides it from HEAD. This repo previously ran no secret scan at all — it
  # pinned ci's ts-publish.yml and nothing else — so nothing ever reported here
  # and branch protection had no scan to require.
  #
  # The brick checks out with fetch-depth: 0 and scans every commit, not just
  # the diff. This repo ships no .gitleaks.toml; the default ruleset applies.
  gitleaks:
    name: Secret scan
    # The reusable workflow lists a PR's commits over the API, which needs
    # pull-requests: read. The workflow-level `contents: read` does not grant it,
    # and a caller job may raise a scope the read-only top level withholds.
    permissions:
      contents: read
      pull-requests: read
    # Pinned to a 40-char commit SHA, not `@ci-v3`: a tag can be repointed at new
    # code, and this job runs with this repo's token. The trailing comment names
    # the EXACT release so Dependabot bumps pin and comment together — a floating
    # `# ci-v3` would silently go wrong the moment upstream moves that tag.
    # Pinning is transitive and holds here: at this SHA the brick's own two
    # `uses:` refs (actions/checkout, gitleaks/gitleaks-action) are both SHAs.
    uses: hseshadr/ci/.github/workflows/secret-scan.yml@dbae0a612749cbc024961c4ed3499622a8370b59 # ci-v3.2.1

  gate:
    runs-on: ubuntu-latest
    steps:
      # Every `uses:` below names a full 40-char commit SHA, not a moving tag. A tag
      # can be repointed at new code; a SHA cannot. The trailing comment records
      # which release that SHA is, so Dependabot's `github-actions` ecosystem bumps
      # both the pin and the comment. test/workflow-security.test.ts enforces this.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate never pushes, so leaving the token in .git/config would only
          # widen what a compromised step can reach.
          persist-credentials: false

      - name: Install pnpm
        # Version comes from package.json "packageManager" — one pin, no drift.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # pnpm-workspace.yaml names the only dependencies allowed to run builds.
        run: pnpm install --frozen-lockfile

      - name: Gate (the exact local command — CI mirrors the gate)
        run: pnpm gate
