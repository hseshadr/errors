# errors — .github/workflows/publish.yml
#
# npm release of `@edgeproc/errors` via OIDC Trusted Publishing. Pushing a `v*` tag is the
# whole trigger. There is NO npm write token in this repository, and there must never be one:
# the credential is a short-lived OIDC token GitHub mints for this job, which npm verifies
# against a trusted publisher registered as {hseshadr, errors, publish.yml}.
#
# ─────────────────────────────────────────────────────────────────────────────────────────
# READ THIS BEFORE THE FIRST RELEASE — the first publish CANNOT use this rail.
# ─────────────────────────────────────────────────────────────────────────────────────────
# npm has no "pending publisher". A trusted publisher is attached to an EXISTING package, so
# a name that has never been published has nothing to attach it to. This is a fact about npm,
# not a gap in this workflow, and no amount of retrying a tag push will get around it.
#
# So `@edgeproc/errors@0.1.0` has to go out ONCE by hand, from an authenticated session
# (`npm publish --access public` with a granular write token or an OTP). Only after the
# package exists can the trusted publisher be registered in the package's npm settings — and
# from then on every release is a `v*` tag push through here, token-free.
#
# The bootstrap, in order:
#   1. Make this repository PUBLIC. `provenance: true` below signs each release into a
#      PUBLIC transparency log, which npm refuses to do for a private source repo. The repo
#      is private as of this commit; flip it before tagging or the publish fails.
#   2. Publish 0.1.0 by hand, authenticated. (One time, for this package name only.)
#   3. Register the trusted publisher on npmjs.com: package settings -> Trusted Publisher ->
#      GitHub Actions -> owner `hseshadr`, repo `errors`, workflow file `publish.yml`.
#   4. Every release after that: bump the version, land it on `main`, push `vX.Y.Z`. Done.
#
# Two more npm truths this caller encodes (see ts-publish.yml in hseshadr/ci):
#   * A published version is immutable. 0.1.0 cannot be re-published to add provenance or fix
#     a mistake — the next release must carry a HIGHER version. Re-tagging v0.1.0 just 403s.
#   * `package.json` `repository.url` MUST match this GitHub repo exactly or the OIDC publish
#     fails with ENEEDAUTH. It does today: git+https://github.com/hseshadr/errors.git.
#
# WHY THE PIN IS A SHA, NOT `@ci-v3`: a tag can be repointed at new code; a 40-char commit
# SHA cannot. That matters most here, because this job holds `id-token: write` — a mutable
# ref anywhere in the chain reaches npm. The trailing comment records which release the SHA
# is, so Dependabot's `github-actions` ecosystem bumps the pin and the comment together, and
# `test/workflow-security.test.ts` fails the gate if any ref here is ever left unpinned.
name: Publish (npm, OIDC)

on:
  push:
    tags: ["v*"]

# Top-level is read-only. The OIDC scope is granted on the publish job alone — the ci repo's
# security policy forbids a top-level `id-token` grant, because a top-level scope applies to
# every job in the file, including ones added later that have no business minting a token.
permissions:
  contents: read

jobs:
  publish:
    permissions:
      id-token: write # OIDC — this token IS the npm credential. Nothing else may hold it.
      contents: read
    uses: hseshadr/ci/.github/workflows/ts-publish.yml@dbae0a612749cbc024961c4ed3499622a8370b59 # ci-v3.2.1
    with:
      working-directory: "."
      node-version: "24"
      # Mirrors ci.yml exactly. pnpm-workspace.yaml names the only dependencies
      # allowed to run install-time builds.
      install-args: "--frozen-lockfile"
      # The gate is lint -> typecheck -> vitest (100% coverage enforced) -> build, with no
      # browser dependency, so re-running it from the TAGGED ref is cheap and is the only
      # thing that proves the artefact being published is the artefact that passed.
      run-gate: true
      # Requires a PUBLIC repo — see step 1 of the bootstrap above.
      provenance: true
