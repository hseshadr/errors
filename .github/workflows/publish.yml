# errors — .github/workflows/publish.yml
#
# npm release of `@edgeproc/errors` via OIDC Trusted Publishing. Pushing a `v*` tag is the
# whole trigger. There is NO npm write token in this repository, and there must never be one:
# the credential is a short-lived OIDC token GitHub mints for the `publish` job below, which
# npm verifies against the trusted publisher registered as {hseshadr, errors, publish.yml}.
#
# THE FILE NAME IS LOAD-BEARING. npm binds the trusted publisher to this workflow's filename,
# so renaming this file silently turns every future release into a 404/ENEEDAUTH. The
# publisher is registered with NO GitHub environment, and neither job below declares one.
#
# ─────────────────────────────────────────────────────────────────────────────────────────
# WHY TWO JOBS
# ─────────────────────────────────────────────────────────────────────────────────────────
# Until 0.1.2 this file called ci's reusable ts-publish.yml: ONE job that held
# `id-token: write` while it ran `pnpm install`, the gate, the build, and
# `npm install -g npm@latest`. Every dev dependency's install script, test, and build plugin
# — and whatever npm shipped as `latest` that minute — ran next to the publish credential and
# could mint it. And any `v*` tag, on any commit of any branch, fired it.
#
#   build   — `contents: read` only. Proves the tagged commit is on `main` and that the tag
#             names the package.json version, runs the full gate from the frozen lockfile,
#             packs the tarball, and uploads it with its checksum. All dependency code runs
#             HERE, where there is no credential to steal.
#   publish — `id-token: write`. Never checks out, never installs, never runs repository or
#             dependency code. It downloads the exact tarball `build` packed, checks its
#             checksum, and hands it to the npm CLI that ships inside the pinned Node release.
#
# npm >= 11.5.1 is required for OIDC. The pinned Node release below bundles npm 11.19.0, so
# no npm is installed at publish time; the job asserts the floor instead of trusting it.
#
# Three npm truths this workflow encodes:
#   * A published version is immutable. A failed or wrong release needs a HIGHER version;
#     re-tagging the same version just 403s.
#   * `package.json` `repository.url` MUST match this GitHub repo exactly or the OIDC publish
#     fails with ENEEDAUTH. It does today: git+https://github.com/hseshadr/errors.git.
#   * `--provenance` signs into a PUBLIC transparency log, so this repository must stay public.
#
# Every `uses:` is a full 40-char commit SHA with the release in a trailing comment, so
# Dependabot bumps pin and comment together; `test/workflow-security.test.ts` fails the gate
# if a ref is left unpinned, if the jobs stop being split, or if an expression is ever
# interpolated into a shell script.
name: Publish (npm, OIDC)

on:
  push:
    tags: ["v*"]

# Top-level is read-only. The OIDC scope is granted on the publish job alone: a top-level
# scope applies to every job in the file, including ones added later.
permissions:
  contents: read

# Never run two releases of the same ref at once, and never cancel one mid-publish.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify tag, gate, and pack (no publish credential)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; do not leave the token in .git/config.
          persist-credentials: false
          # Full history, so the tagged commit can be tested against main's history.
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main. Release only from main."
            exit 1
          fi

      - name: Install pnpm
        # Version comes from package.json "packageManager" — one pin, no drift.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          # No dependency cache in a release workflow: a cache written by another
          # workflow run must never feed the artefact that gets published.
          package-manager-cache: false

      - name: Require the tag to name the package.json version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version v$version."
            exit 1
          fi

      - name: Install dependencies
        # pnpm-workspace.yaml names the only dependencies allowed to run builds.
        run: pnpm install --frozen-lockfile

      - name: Gate (the exact local command — lint, typecheck, 100% coverage, build)
        run: pnpm gate

      - name: Pack the release tarball
        run: |
          pnpm pack --pack-destination release
          cd release
          shopt -s nullglob
          tarballs=(*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one tarball, found ${#tarballs[@]}."
            exit 1
          fi
          sha256sum "${tarballs[0]}" > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the packed tarball via npm OIDC
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC — this token IS the npm credential. Nothing else may hold it.
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball-${{ github.sha }}
          path: release

      - name: Setup Node (bundles the npm CLI that publishes)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Require an OIDC-capable npm (>= 11.5.1)
        run: |
          npm --version
          node -e '
            const version = process.argv[1];
            const [major, minor, patch] = version.split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error("npm " + version + " cannot publish via OIDC"); process.exit(1); }
          ' "$(npm --version)"

      - name: Verify the tarball is the one build packed
        working-directory: release
        run: sha256sum --check --strict SHA256SUMS

      - name: Publish to npm (OIDC Trusted Publishing, with provenance)
        run: |
          shopt -s nullglob
          tarballs=(release/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one tarball, found ${#tarballs[@]}."
            exit 1
          fi
          npm publish "${tarballs[0]}" --provenance --access public

      # A green `npm publish` is not the same fact as "the registry serves it". Ask it.
      - name: Verify the release is actually on npm
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          for attempt in $(seq 1 30); do
            if [ "$(npm view "@edgeproc/errors@$version" version 2>/dev/null)" = "$version" ]; then
              echo "npm serves @edgeproc/errors@$version"
              exit 0
            fi
            echo "attempt $attempt/30: @edgeproc/errors@$version not visible yet"
            sleep 10
          done
          echo "::error::@edgeproc/errors@$version never appeared on npm."
          exit 1
